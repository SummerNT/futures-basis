name: daily-refresh

on:
  schedule:
    # Never use an exact hour: GitHub drops or delays scheduled runs during
    # high load, and minute 0 is the worst slot. Three staggered slots give
    # redundancy -- a later run simply finds no data change and skips commit.
    # Beijing 16:13 / 16:43 / 18:13  ==  UTC 08:13 / 08:43 / 10:13, Mon-Fri.
    - cron: "13 8 * * 1-5"
    - cron: "43 8 * * 1-5"
    - cron: "13 10 * * 1-5"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "run.py"
      - ".github/workflows/daily.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh data and render page
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          # Scheduled runs skip rendering when no new trading day exists, so the
          # three cron slots cannot produce duplicate commits.
          SKIP_IF_NO_NEW: ${{ github.event_name == 'schedule' }}
        run: python run.py --days 20

      - name: Commit updated data and page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%d)"
            git push
          fi
