name: daily-refresh

on:
  # GitHub's built-in scheduler proved unreliable for this repo: runs were
  # delayed by 6+ hours or dropped entirely (2026-10-26 / 10-27). Scheduling
  # is now handled by a Cloudflare Worker that calls the workflow_dispatch
  # API at 16:30 Beijing time (see scripts/worker.js).
  # schedule:
  #   - cron: "13 8 * * 1-5"
  #   - cron: "43 8 * * 1-5"
  #   - cron: "13 10 * * 1-5"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "run.py"
      - ".github/workflows/daily.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh data and render page
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          # Scheduled runs skip rendering when no new trading day exists, so the
          # three cron slots cannot produce duplicate commits.
          SKIP_IF_NO_NEW: ${{ github.event_name == 'schedule' }}
        run: python run.py --days 20

      - name: Commit updated data and page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%d)"
            git push
          fi
